name: Backend CI

# Monorepo: only runs when the backend (or this workflow) changes.
# Checks run inside the production Docker image, which is the only place GDAL/
# GEOS/PROJ are guaranteed to match the pinned binding (the bare runner cannot
# pip-install the GDAL binding without a matching system libgdal).
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    env:
      # Throwaway values for the no-DB steps (system check, migration check).
      # The test step adds the database env separately (tests need PostGIS).
      DOCKER_RUN: docker run --rm -e SECRET_KEY=ci-not-secret -e DEBUG=True -e RUN_MIGRATIONS=false
    services:
      # PostGIS for the test suite; Django builds an isolated test DB from it.
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: webgisdb
          POSTGRES_USER: webgis
          POSTGRES_PASSWORD: webgis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webgis -d webgisdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t webgis-backend ./backend

      - name: Django system check
        run: $DOCKER_RUN --entrypoint python webgis-backend manage.py check

      - name: Check for missing migrations
        run: $DOCKER_RUN --entrypoint python webgis-backend manage.py makemigrations --check --dry-run

      - name: Run tests
        # Tests need PostGIS. Run inside the built image on the host network so it
        # reaches the `db` service container via localhost:5432.
        run: |
          docker run --rm --network host \
            -e SECRET_KEY=ci-not-secret -e DEBUG=True -e RUN_MIGRATIONS=false \
            -e POSTGRES_ENGINE=django.contrib.gis.db.backends.postgis \
            -e POSTGRES_DB=webgisdb -e POSTGRES_USER=webgis -e POSTGRES_PASSWORD=webgis \
            -e POSTGRES_HOST=localhost -e POSTGRES_PORT=5432 \
            --entrypoint pytest webgis-backend -q
